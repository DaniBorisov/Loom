    <path d="M4 4 C 4 30, 56 30, 56 56" stroke="#7A1F1F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M56 4 C 56 30, 4 30, 4 56" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>
  <text x="160" y="252"
        text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="60"
        font-weight="600"
        letter-spacing="0.5"
        fill="#FFFFFF">loom</text>
</svg>
