<svg width="320" height="300" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Stacked Loom lockup for square-ish placements (login, setup, reset):
       same threads mark as the horizontal wordmark, centered above the name -->
