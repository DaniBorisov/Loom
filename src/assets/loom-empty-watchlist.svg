<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Empty watchlist: a simple outlined list/bookmark shape with an unspooled
       thread underneath, tying back to the Loom mark rather than a generic icon -->

  <!-- List card outline -->
  <rect x="55" y="30" width="110" height="130" rx="10"
        fill="none" stroke="#4B5563" stroke-width="4"/>

  <!-- List lines (sparse, suggesting "nothing added yet") -->
  <line x1="75" y1="60" x2="145" y2="60" stroke="#4B5563" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="75" y1="80" x2="125" y2="80" stroke="#4B5563" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Dashed placeholder line, softer, where the next item would go -->
  <line x1="75" y1="100" x2="135" y2="100" stroke="#374151" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 8" opacity="0.5"/>

  <!-- Loom thread motif, unspooled beneath the card -->
  <path d="M60 190 C 90 170, 130 210, 160 190"
        stroke="#7A1F1F" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
