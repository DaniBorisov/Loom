<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Square background so the icon reads correctly on light AND dark home screens/tabs -->
  <rect width="512" height="512" rx="96" fill="#1A1A1A"/>

  <!-- Loom mark: two interwoven threads, scaled up and centered from the wordmark's icon -->
  <g transform="translate(96, 96)">
    <path d="M32 32 C 32 240, 288 240, 288 448"
          stroke="#7A1F1F" stroke-width="40" fill="none" stroke-linecap="round"/>
    <path d="M288 32 C 288 240, 32 240, 32 448"
          stroke="#7A1F1F" stroke-width="40" fill="none" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
